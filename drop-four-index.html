<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drop Four</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1d2030;--muted:#6b7088;--line:#dfe2ef;--p1:#e5484d;--p2:#f5b82e;--accent:#6c4cf1;--board:#2f5fd0;--hole:#e9edfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--card:#1e2030;--text:#eef0fa;--muted:#9aa0bb;--line:#33364d;--p1:#ff6b70;--p2:#ffc94d;--accent:#8f77ff;--board:#3a6be0;--hole:#14151f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151f;--card:#1e2030;--text:#eef0fa;--muted:#9aa0bb;--line:#33364d;--p1:#ff6b70;--p2:#ffc94d;--accent:#8f77ff;--board:#3a6be0;--hole:#14151f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.card{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:0 6px 24px rgba(0,0,0,.12);text-align:center}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{display:block;width:100%;padding:14px;margin:10px 0;background:var(--accent);color:#fff;font-weight:600;font-size:1.05rem}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.seg button{flex:1;min-width:70px;padding:10px;background:transparent;border:2px solid var(--line);color:var(--text);font-size:.85rem}
.seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
input{width:100%;padding:12px;margin:0 0 8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.hide{display:none!important}
.score{display:flex;gap:8px;margin-bottom:10px}
.pl{flex:1;padding:8px 6px;border-radius:12px;border:2px solid var(--line)}
.pl.turn{border-color:var(--accent)}
.pl b{display:block;font-size:1.6rem}
.pl span{font-size:.8rem;color:var(--muted)}
.pl i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.round{font-weight:600;margin-bottom:4px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.a{background:var(--p1)}.dot.b{background:var(--p2)}.dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.status{min-height:1.5em;margin:6px 0 10px;color:var(--muted)}
.big{font-size:1.4rem;margin:6px 0;color:var(--text)}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--board);padding:8px;border-radius:14px;margin-bottom:14px}
.cell{aspect-ratio:1;border-radius:50%;background:var(--hole);padding:0;border:3px solid transparent}
.cell.a{background:var(--p1)}.cell.b{background:var(--p2)}
.cell.win{border-color:#fff;box-shadow:0 0 0 2px var(--text)}
.cell.drop{animation:fall .35s ease-in}
@keyframes fall{from{transform:translateY(-220px)}to{transform:none}}
.cell:disabled{cursor:default}
table{width:100%;border-collapse:collapse;margin-bottom:12px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}td:nth-child(2){text-align:left}th{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div id="pvgate" style="position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg,#eef1fb)"><div style="background:var(--card,#fff);color:var(--text,#1d2030);border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);font-family:system-ui,sans-serif"><h2 style="margin:0 0 8px">Drop Four</h2><p id="pvmsg" style="margin:0 0 14px;opacity:.75">Loading…</p><button id="pvbtn" style="display:none;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent,#6c4cf1);color:#fff;font:inherit;font-weight:600;font-size:1.05rem">🔐 Sign in with Google</button><a href="https://playversegames.github.io/clue-rush/" style="display:block;margin-top:14px;color:inherit;opacity:.6;text-decoration:none;font-size:.9rem">← Playverse</a></div></div>
<div class="card">
  <section id="menu">
<a href="https://playversegames.github.io/clue-rush/" style="display:block;text-align:left;margin-bottom:8px;color:var(--muted,#6b7088);text-decoration:none;font-size:.9rem">← Playverse</a>
    <h1>Drop Four</h1>
    <p class="sub">Connect four to win</p>
    <input id="p1" maxlength="12" placeholder="Player 1 name (red)" autocomplete="off">
    <input id="p2" maxlength="12" placeholder="Player 2 name – same phone only" autocomplete="off">
    <button class="btn" id="pBot">Play with Bot</button>
    <div id="diff" class="hide">
      <div class="seg"><button data-d="easy">Easy</button><button data-d="medium" class="on">Medium</button><button data-d="hard">Hard</button></div>
      <button class="btn" id="goBot">Start</button>
    </div>
    <button class="btn" id="pOnline">🌐 Play Online</button>
    <div id="onl" class="hide">
      <button class="btn" id="oCreate">Create room</button>
      <input id="oCode" maxlength="4" placeholder="Room code" autocomplete="off" autocapitalize="characters">
      <button class="btn alt" id="oJoin">Join room</button>
      <p class="sub" id="oMsg"></p>
    </div>
    <button class="btn alt" id="pFriend">Same phone (2 players)</button>
    <button class="btn alt" id="pLB">🏆 Leaderboard</button>
  </section>

  <section id="lb" class="hide">
    <h1>🏆 Leaderboard</h1>
    <p class="sub">Online · all signed-in players</p>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Name</th><th>Wins</th><th>Games</th><th>Win %</th></tr></thead><tbody id="lbBody"></tbody></table></div>
    <p class="sub hide" id="lbEmpty">No games yet – play a match!</p>
    <button class="btn" id="lbBack">Back</button>
  </section>

  <section id="game" class="hide">
    
    
    <div class="sub hide" id="rcode" style="text-align:center;font-weight:700"></div>
    <button class="btn alt hide" id="invite">Share invite link</button>
    <div class="score">
      <div class="pl" id="pl1"><span><i style="background:var(--p1)"></i><em id="n1" style="font-style:normal"></em></span><b id="s1">0</b></div>
      <div class="pl" id="pl2"><span><i style="background:var(--p2)"></i><em id="n2" style="font-style:normal"></em></span><b id="s2">0</b></div>
    </div>
    <div class="status" id="status"></div>
    <div class="board" id="board"></div>
    <button class="btn" id="next">Next Round</button>
    <button class="btn alt" id="quit">Main Menu</button>
  </section>
</div>

<script>
const R=6,C=7,$=id=>document.getElementById(id);
const W=[];
for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
  const er=r+3*dr,ec=c+3*dc;
  if(er<0||er>=R||ec<0||ec>=C)continue;
  W.push([0,1,2,3].map(k=>(r+k*dr)*C+c+k*dc));
}
const BLUNDER={easy:0.6,medium:0.25,hard:0.08},DEPTH={easy:1,medium:3,hard:5};
const pn={1:'Player 1',2:'Player 2'};
let mode='friend',diff='medium',board,turn,scores,results,over,locked,lastIdx;
let full=false,seat=0,rc=null,unsub=null,lastRec=-2;

function winOf(b){for(const w of W){const v=b[w[0]];if(v&&v===b[w[1]]&&v===b[w[2]]&&v===b[w[3]])return{p:v,line:w};}return null;}
function moves(b){return[3,2,4,1,5,0,6].filter(c=>!b[c]);}
function drop(b,c,p){for(let r=R-1;r>=0;r--){const i=r*C+c;if(!b[i]){b[i]=p;return i;}}return -1;}
function heur(b,me){
  const op=me===1?2:1;let s=0;
  for(let r=0;r<R;r++)if(b[r*C+3]===me)s+=3;else if(b[r*C+3]===op)s-=3;
  for(const w of W){let m=0,o=0;for(const i of w){if(b[i]===me)m++;else if(b[i]===op)o++;}
    if(!o)s+=m===3?5:m===2?2:0;
    if(!m)s-=o===3?6:o===2?2:0;}
  return s;
}
function search(b,d,a,be,p,me){
  const w=winOf(b);if(w)return w.p===me?1000+d:-1000-d;
  const mv=moves(b);if(!mv.length)return 0;if(d===0)return heur(b,me);
  const op=p===1?2:1,max=p===me;let best=max?-1e9:1e9;
  for(const c of mv){
    const i=drop(b,c,p),s=search(b,d-1,a,be,op,me);b[i]=null;
    if(max){best=Math.max(best,s);a=Math.max(a,best);}else{best=Math.min(best,s);be=Math.min(be,best);}
    if(a>=be)break;
  }
  return best;
}
function botMove(){
  const mv=moves(board);
  if(Math.random()<BLUNDER[diff])return mv[Math.floor(Math.random()*mv.length)];
  let best=-1e9,pick=[];
  for(const c of mv){
    const i=drop(board,c,2),s=search(board,DEPTH[diff]-1,-1e9,1e9,1,2);board[i]=null;
    if(s>best){best=s;pick=[c];}else if(s===best)pick.push(c);
  }
  return pick[Math.floor(Math.random()*pick.length)];
}

const decided=()=>results.filter(r=>r!=='T');
const matchDone=()=>decided().length>=3;
function startMatch(){
  const a=$('p1').value.trim().slice(0,12),b=$('p2').value.trim().slice(0,12);
  pn[1]=a||'Player 1';pn[2]=mode==='bot'?'Bot':(b||'Player 2');
  if(mode!=='bot'&&pn[2].toLowerCase()===pn[1].toLowerCase())pn[2]+=' 2';
  $('n1').textContent=pn[1];$('n2').textContent=pn[2];
  scores={1:0,2:0};results=[];
  $('menu').classList.add('hide');$('game').classList.remove('hide');
  newRound();
}
function newRound(){
  board=Array(R*C).fill(null);over=false;locked=false;lastIdx=-1;
  turn=results.length%2===0?1:2;
  $('next').classList.add('hide');
  render();
  if(mode==='bot'&&turn===2)botTurn();
}
function render(win){
  const bd=$('board');bd.innerHTML='';
  board.forEach((v,i)=>{
    const c=document.createElement('button');
    c.className='cell'+(v?(v===1?' a':' b'):'')+(i===lastIdx?' drop':'')+(win&&win.includes(i)?' win':'');
    c.disabled=over||(mode==='bot'&&turn===2)||(mode==='online'&&(!full||turn!==seat));
    c.setAttribute('aria-label','Column '+(i%C+1));
    c.onclick=()=>play(i%C);
    bd.appendChild(c);
  });
  $('s1').textContent=scores[1];$('s2').textContent=scores[2];

  $('pl1').classList.toggle('turn',!over&&turn===1);
  $('pl2').classList.toggle('turn',!over&&turn===2);



  if(!over)$('status').textContent=mode==='online'?(!full?'Waiting for a friend to join…':(turn===seat?'Your turn':pn[turn]+'’s turn')):pn[turn]+(mode==='bot'&&turn===2?' is thinking…':'’s turn');
}
function play(c){
  if(mode==='online'){
    if(over||!full||turn!==seat||board[c])return;
    const b=board.slice(),i=drop(b,c,seat);if(i<0)return;
    const w=winOf(b),up={b:b.map(x=>x||0).join(''),li:i};
    if(w){up.over=true;up['s'+seat]=scores[seat]+1;up.r=results.join('')+seat;}
    else if(!moves(b).length){up.over=true;up.r=results.join('')+'T';}
    else up.t=seat===1?2:1;
    PV.upd(rc,up);return;
  }
  if(over||locked||board[c])return;
  const i=drop(board,c,turn);lastIdx=i;
  const w=winOf(board);
  if(w)return endRound(w);
  if(!moves(board).length)return endRound(null);
  turn=turn===1?2:1;
  render();
  if(mode==='bot'&&turn===2)botTurn();
}
function botTurn(){
  locked=true;
  setTimeout(()=>{locked=false;if(!over)play(botMove());},550);
}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function endRound(w){
  over=true;
  if(w){scores[w.p]++;results.push(w.p);record(w.p);$('status').innerHTML='<div class="big">🏆 '+esc(pn[w.p])+' wins!</div>';}
  else{results.push('T');$('status').textContent='It’s a draw – this game will be replayed.';}
  render(w&&w.line);
  $('next').textContent=w?'Play Again':'Replay Game';$('next').onclick=newRound;
  $('next').classList.remove('hide');
}

const LBK='c4_leaderboard';
try{if(!localStorage.getItem('c4_lb_reset_1')){localStorage.removeItem(LBK);localStorage.setItem('c4_lb_reset_1','1');}}catch(e){}
function lbLoad(){try{return JSON.parse(localStorage.getItem(LBK))||{};}catch(e){return {};}}
function lbSave(d){try{localStorage.setItem(LBK,JSON.stringify(d));}catch(e){}}
function record(champ){
  const d=lbLoad();
  for(const p of(mode==='bot'?[1]:[1,2])){
    const k=pn[p].toLowerCase();
    const e=d[k]||(d[k]={name:pn[p],played:0,won:0,rounds:0});
    e.played++;if(p===champ)e.won++;e.rounds+=scores[p];
  }
  lbSave(d);
  if(window.PV&&PV.user)PV.add(champ===1?1:0,1);
}
async function showLB(){
  $('menu').classList.add('hide');$('lb').classList.remove('hide');
  const body=$('lbBody');body.innerHTML='';let d=null;
  if(window.PV&&PV.user){try{d=await PV.top('won')}catch(e){}}
  if(!d)d=Object.values(lbLoad()).sort((a,b)=>b.won-a.won||(b.won/b.played)-(a.won/a.played));
  $('lbEmpty').classList.toggle('hide',d.length>0);
  d.slice(0,20).forEach((e,i)=>{
    const tr=document.createElement('tr');
    [(['🥇','🥈','🥉'][i]||i+1),e.name,e.won||0,e.played||0,Math.round(100*(e.won||0)/(e.played||1))+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});
    body.appendChild(tr);
  });
}
$('pLB').onclick=showLB;
$('lbBack').onclick=()=>{$('lb').classList.add('hide');$('menu').classList.remove('hide');};
$('pBot').onclick=()=>$('diff').classList.toggle('hide');
document.querySelectorAll('#diff .seg button').forEach(b=>b.onclick=()=>{
  diff=b.dataset.d;
  document.querySelectorAll('#diff .seg button').forEach(x=>x.classList.toggle('on',x===b));
});
$('goBot').onclick=()=>{mode='bot';startMatch();};
$('pFriend').onclick=()=>{mode='friend';startMatch();};
$('quit').onclick=()=>{if(mode==='online'&&rc){PV.upd(rc,{gone:PV.user.uid});leaveOnline();return;}over=true;locked=true;$('game').classList.add('hide');$('menu').classList.remove('hide');$('diff').classList.add('hide');};
function oNext(){if(!over||!rc)return;PV.upd(rc,{b:'0'.repeat(42),over:false,li:-1,t:results.length%2===0?1:2});}
function onRoom(d){
  if(!d){leaveOnline();return;}
  const first=lastRec===-2,gone=!!d.gone&&d.gone!==PV.user.uid;
  full=!!d.p2u;pn[1]=d.p1n||'Player 1';pn[2]=full?d.p2n:'Waiting…';
  $('n1').textContent=pn[1];$('n2').textContent=pn[2];
  board=[...d.b].map(x=>x==='0'?null:+x);turn=d.t;scores={1:d.s1,2:d.s2};
  results=[...d.r].map(x=>x==='T'?'T':+x);over=d.over||gone;lastIdx=d.li;locked=false;
  $('rcode').textContent='Room code: '+rc;$('rcode').classList.remove('hide');$('invite').classList.toggle('hide',full);
  const w=winOf(board);render(d.over&&w?w.line:null);
  if(gone){$('status').textContent='Your friend left the room.';$('next').classList.add('hide');return;}
  if(!over){lastRec=-1;$('next').classList.add('hide');return;}
  $('status').innerHTML=w?'<div class="big">🏆 '+esc(pn[w.p])+(w.p===seat?' (you)':'')+' wins!</div>':'It’s a draw – play again!';
  $('next').textContent=w?'Play Again':'Replay Game';$('next').onclick=oNext;$('next').classList.remove('hide');
  if(w&&(first||lastRec!==results.length)){if(!first)PV.add(w.p===seat?1:0,1);lastRec=results.length;}else if(first)lastRec=-1;
}

const genCode=()=>{const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c;};
const oMsg=t=>{$('oMsg').textContent=t;};
function enterRoom(c,s){mode='online';rc=c;seat=s;lastRec=-2;full=false;$('menu').classList.add('hide');$('game').classList.remove('hide');$('next').classList.add('hide');$('invite').textContent='Share invite link';unsub=PV.sub(c,onRoom);}
async function oCreate(){oMsg('Creating room…');for(let n=0;n<6;n++){const c=genCode();if(await PV.create(c,{p1u:PV.user.uid,p1n:PV.name,p2u:'',p2n:'',b:'0'.repeat(42),t:1,s1:0,s2:0,r:'',over:false,li:-1,gone:''})){oMsg('');enterRoom(c,1);return;}}oMsg('Could not create a room. Try again.');}
async function doJoin(c){c=String(c||'').trim().toUpperCase();if(c.length!==4){oMsg('Enter the 4-letter room code.');return;}oMsg('Joining…');const r=await PV.join(c);if(r.err){oMsg(r.err);return;}oMsg('');enterRoom(c,r.seat);}
function leaveOnline(){if(unsub){unsub();unsub=null;}rc=null;mode='friend';full=false;seat=0;$('game').classList.add('hide');$('menu').classList.remove('hide');$('onl').classList.add('hide');$('rcode').classList.add('hide');$('invite').classList.add('hide');}
$('pOnline').onclick=()=>$('onl').classList.toggle('hide');
$('oCreate').onclick=oCreate;$('oJoin').onclick=()=>doJoin($('oCode').value);
$('invite').onclick=async()=>{const u=location.origin+location.pathname+'?room='+rc;try{if(navigator.share)await navigator.share({title:'Drop Four',text:'Join my game! Room code '+rc,url:u});else{await navigator.clipboard.writeText(u);$('invite').textContent='Link copied ✓';}}catch(e){}};
document.addEventListener('pv-ready',()=>{$('p1').value=PV.name;const q=(new URLSearchParams(location.search).get('room')||'').toUpperCase();if(q){$('onl').classList.remove('hide');doJoin(q);}});
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,linkWithPopup,signInWithCredential,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction,increment,serverTimestamp,collection,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDHcp44KXR6Gax_Vf3fwdinWBgJB4l_92Y",authDomain:"clue-rush-a7bbe.firebaseapp.com",projectId:"clue-rush-a7bbe",storageBucket:"clue-rush-a7bbe.firebasestorage.app",messagingSenderId:"439710542707",appId:"1:439710542707:web:b55e0a8f2c309b86e8b306"}),auth=getAuth(app),fs=getFirestore(app),COLL="dropfour";
const g=document.getElementById("pvgate"),b=document.getElementById("pvbtn"),m=document.getElementById("pvmsg");
const ref=()=>doc(fs,COLL,PV.user.uid),rr=c=>doc(fs,COLL+"Rooms",c);
window.PV={user:null,name:"",
  async add(w,p){try{await setDoc(ref(),{name:PV.name,won:increment(w),played:increment(p),at:serverTimestamp()},{merge:true})}catch(e){}},
  async best(sc,k){try{const s=await getDoc(ref()),c=s.exists()?(s.data().best||0):0;if(sc>c)await setDoc(ref(),{name:PV.name,best:sc,kills:k,at:serverTimestamp()},{merge:true});return Math.max(sc,c)}catch(e){return sc}},
  async mine(){try{const s=await getDoc(ref());return s.exists()?s.data():{}}catch(e){return {}}},
  async top(f){const q=await getDocs(query(collection(fs,COLL),orderBy(f,"desc"),limit(20)));return q.docs.map(d=>({id:d.id,...d.data()}))},
  async create(c,d){try{const r=rr(c),s=await getDoc(r);if(s.exists())return false;await setDoc(r,{...d,at:serverTimestamp()});return true}catch(e){return false}},
  async join(c){try{return await runTransaction(fs,async t=>{const r=rr(c),s=await t.get(r);if(!s.exists())return{err:"No room with that code."};const d=s.data(),me=PV.user.uid;if(d.gone)return{err:"That room has closed."};if(d.p1u===me)return{seat:1};if(d.p2u===me)return{seat:2};if(d.p2u)return{err:"That room is full."};t.update(r,{p2u:me,p2n:PV.name});return{seat:2}})}catch(e){return{err:"Could not join. Try again."}}},
  sub(c,cb){return onSnapshot(rr(c),s=>cb(s.exists()?s.data():null),()=>{})},
  async upd(c,d){try{await updateDoc(rr(c),d)}catch(e){}},
  out(){signOut(auth).finally(()=>location.reload())}};
b.onclick=async()=>{const pr=new GoogleAuthProvider(),cu=auth.currentUser;try{
  if(cu&&cu.isAnonymous){try{await linkWithPopup(cu,pr)}catch(e){if(e&&e.code==="auth/credential-already-in-use")await signInWithCredential(auth,GoogleAuthProvider.credentialFromError(e));else throw e}}
  else await signInWithPopup(auth,pr);
  if(auth.currentUser&&!auth.currentUser.isAnonymous)enter(auth.currentUser)}
  catch(e){const c=e&&e.code;if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,pr);else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")m.textContent="Sign-in failed. Please try again."}};
function enter(u){if(PV.user)return;PV.user=u;PV.name=String(u.displayName||"Player").split(" ")[0].slice(0,12);g.remove();document.dispatchEvent(new Event("pv-ready"))}
onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous)enter(u);else if(!PV.user){m.textContent="Sign in with Google to play.";b.style.display=""}});
</script>
</body>
